name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --requirement requirements.txt
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Check the README's numbers against the committed artifacts
        # The README's results table once advertised AUC 0.789-0.859 while the
        # committed models scored 0.572-0.674 on holdout. Prose cannot update
        # itself, so the section is generated and this is what notices when it
        # stops matching.
        run: python scripts/readme_metrics.py --check

  dashboard:
    # The dashboard is the deployed half of this project and had no CI at all —
    # a type error or a broken import only showed up when Vercel failed a build
    # after the push.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t churn-engine:ci .
